<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الجدول الدوري للعناصر</title>
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a dark chemistry lab wall. The 118 elements live in a CSS 3D world and fly between table, states-of-matter, discovery timeline, sphere and helix. Views, search and quiz at the top; family legend (and the temperature dial in the states view) at the bottom; the element card with its animated atom replaces them when an element is picked. Single dark look; family hues only. */
:root{
 --bg:#05070d; --ink:#eef0f7; --muted:#9aa1b8; --line:rgba(150,165,210,.24); --glass:rgba(8,11,22,.8);
 --amber:#ffb547; --ice:#8fb4ff; --ok:#5ee0a0; --bad:#ff7a8a; --hot:#ff8a3d; --cold:#7cc4ff;
 --display:"Reem Kufi","Tajawal","Segoe UI",Tahoma,sans-serif;
 --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
 --num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --sym:"Chakra Petch","JetBrains Mono",ui-monospace,monospace;
 color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--body);
 background:radial-gradient(ellipse at 50% 40%,#0d1226 0%,var(--bg) 70%)}
[hidden]{display:none!important}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.n{direction:ltr;unicode-bidi:isolate;font-family:var(--num);font-variant-numeric:tabular-nums}

#bg{position:fixed;inset:0;width:100%;height:100%;display:block;
 background-image:linear-gradient(rgba(120,140,200,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,200,.05) 1px,transparent 1px);background-size:44px 44px}
#stage{position:fixed;inset:0;perspective:1200px;overflow:hidden;cursor:grab}
#stage:active{cursor:grabbing}
#cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}

/* element tiles */
.el{position:absolute;left:-60px;top:-75px;width:120px;height:150px;box-sizing:border-box;direction:ltr;color:var(--ink);overflow:hidden;
 border:1px solid rgba(var(--c),.6);background:rgba(var(--c),.17);border-radius:6px;cursor:pointer;
 transition:background .6s,border-color .6s,box-shadow .5s,opacity .5s}
.el .z{position:absolute;top:7px;left:9px;font:500 14px var(--num);color:rgba(238,240,247,.85)}
.el .st{position:absolute;top:6px;right:8px;font:700 14px var(--body);color:rgb(var(--c));opacity:0;transition:opacity .4s}
.el .sy{position:absolute;left:0;right:0;top:30px;text-align:center;font:700 54px/1 var(--sym);color:rgb(var(--c));text-shadow:0 0 18px rgba(var(--c),.45)}
.el .nm{position:absolute;left:4px;right:4px;top:92px;text-align:center;font:500 15px/1.2 var(--body);direction:rtl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el .ms{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:500 12px var(--num);color:rgba(238,240,247,.8)}
.el.dim{opacity:.12}
.el.sel{border-color:#fff;box-shadow:0 0 40px rgba(255,255,255,.55),inset 0 0 22px rgba(var(--c),.6)}
#cam .el.sel{background:linear-gradient(rgba(var(--c),.3),rgba(var(--c),.3)),#0b0f1e}
.el.ok{box-shadow:0 0 40px rgba(94,224,160,.9),inset 0 0 20px rgba(94,224,160,.5);border-color:var(--ok)}
.el.bad{box-shadow:0 0 40px rgba(255,122,138,.9),inset 0 0 20px rgba(255,122,138,.5);border-color:var(--bad)}
.quiz .el .nm{visibility:hidden}
/* states of matter */
.states .el .st{opacity:1}
.el::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,rgba(var(--c),.18),rgba(var(--c),.5));transition:height .6s ease;pointer-events:none}
.states .el.sl::after{height:52%;animation:slosh 2.6s ease-in-out infinite}
@keyframes slosh{0%,100%{transform:skewY(-5deg) translateY(2px)}50%{transform:skewY(5deg) translateY(-2px)}}
.states .el.sg{background:rgba(var(--c),.05);border-style:dashed;border-color:rgba(var(--c),.55)}
.states .el.sg .sy{opacity:.8;text-shadow:0 0 24px rgba(var(--c),.9)}
.states .el.su{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px)}
.ghost{position:absolute;left:-60px;top:-75px;width:120px;height:150px;box-sizing:border-box;border:1px dashed rgba(150,165,210,.35);border-radius:6px;
 display:grid;place-items:center;font:500 16px var(--num);color:var(--muted);direction:ltr;transition:opacity .8s;pointer-events:none}
.tl{position:absolute;left:-150px;top:-30px;width:300px;text-align:center;font:700 24px var(--num);color:var(--muted);direction:ltr;transition:opacity .8s;pointer-events:none;white-space:nowrap}
.tl.ar{font:700 26px var(--body);direction:rtl}
#key{position:absolute;left:-650px;top:-230px;width:1300px;height:460px;box-sizing:border-box;padding:26px 40px;direction:rtl;transition:opacity .8s;pointer-events:none;
 display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
#key .kt{font:700 74px/1.1 var(--display);color:var(--ink);text-shadow:0 0 30px rgba(143,180,255,.35)}
#key .ks{margin-top:14px;font:400 26px/1.6 var(--body);color:var(--muted);max-width:30ch}
#key .kb{margin-top:18px;font:700 26px var(--body);color:var(--amber)}
#key .kx{position:relative;width:330px;height:300px}
#key .kx .el{position:absolute;left:105px;top:60px;transform:scale(1.25);cursor:default;--c:160,170,210}
#key .kx span{position:absolute;font:500 18px var(--body);color:var(--muted);white-space:nowrap}
#key .kx span::before{content:"";position:absolute;top:50%;width:26px;border-top:1px solid var(--line)}
#key .kx .l1{left:-18px;top:58px} #key .kx .l1::before{left:100%;margin-left:4px}
#key .kx .l3{left:-6px;top:120px} #key .kx .l3::before{left:100%;margin-left:4px}
#key .kx .l4{right:-10px;top:178px} #key .kx .l4::before{right:100%;margin-right:4px}
#key .kx .l5{left:-30px;top:232px} #key .kx .l5::before{left:100%;margin-left:4px}

/* HUD */
.hud{position:fixed;inset:0;pointer-events:none;direction:rtl;font-family:var(--body)}
#top{position:absolute;top:0;left:0;right:0;display:grid;justify-items:center;gap:8px;
 padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
 opacity:0;transition:opacity 1s}
#top.on{opacity:1}
.pill{pointer-events:auto;font:500 13px/1 var(--body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{border-color:var(--amber);color:#ffe2b0;background:rgba(60,36,10,.62)}
#views{pointer-events:auto;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--glass);max-width:100%;overflow-x:auto;scrollbar-width:none}
#views::-webkit-scrollbar{display:none}
#views button{flex:none;font:500 13px/1 var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}
#views button[aria-pressed="true"]{color:#1a1000;background:var(--amber);font-weight:700}
#findrow{display:flex;gap:8px;width:min(440px,100%)}
#find{pointer-events:auto;flex:1;min-width:0;box-sizing:border-box;font:500 14px var(--body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 12px;
 -webkit-user-select:text;user-select:text;touch-action:auto}
#find::placeholder{color:var(--muted)}
@media (max-width:420px){#views button{padding:8px 9px;font-size:12.5px}}

#bottom{position:absolute;left:0;right:0;bottom:0;display:grid;gap:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);opacity:0;transition:opacity 1s}
#bottom.on{opacity:1}
#temp{pointer-events:auto;justify-self:center;width:min(560px,calc(100% - 32px));box-sizing:border-box;display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--glass);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);touch-action:auto}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
#tC{font:700 28px/1 var(--num);direction:ltr;unicode-bidi:isolate}
#tK{font:500 12px var(--num);color:var(--muted);direction:ltr;unicode-bidi:isolate;margin-inline-start:8px}
#tN{font:500 12.5px var(--body);color:var(--muted)}
#tN b{color:var(--ink);font-family:var(--num)}
#tR{width:100%;margin:0;accent-color:var(--hot);height:28px;direction:ltr}
.tpre{display:flex;gap:6px;flex-wrap:wrap}
.tpre button{font:500 12px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.tpre button:hover{color:var(--ink)}
#tNote{font:500 13px/1.5 var(--body);color:#ffe2b0;min-height:0}
#tNote:empty{display:none}
#legend{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#legend::-webkit-scrollbar{display:none}
#legend button{pointer-events:auto;flex:none;display:flex;align-items:center;gap:7px;font:500 12.5px var(--body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer;white-space:nowrap}
#legend button i{width:10px;height:10px;border-radius:3px;background:rgb(var(--c));box-shadow:0 0 8px rgba(var(--c),.7)}
#legend button em{font:500 11px var(--num);font-style:normal;color:var(--muted)}
#legend button[aria-pressed="true"]{border-color:rgb(var(--c));background:rgba(var(--c),.2)}
@media (min-width:1200px){#legend{justify-content:center}}

#card{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(580px,calc(100% - 32px));box-sizing:border-box;pointer-events:auto;
 display:grid;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--glass);max-height:calc(100% - 140px);overflow:auto;
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transform:translate(-50%,16px);transition:opacity .45s ease,transform .45s ease;touch-action:auto}
#card.on{opacity:1;transform:translate(-50%,0)}
#card>*{min-width:0}
.chead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.mini{position:relative;width:74px;height:92px;box-sizing:border-box;direction:ltr;border:1px solid rgba(var(--c),.7);background:rgba(var(--c),.2);border-radius:6px}
.mini .z{position:absolute;top:5px;left:6px;font:500 11px var(--num);color:rgba(238,240,247,.85)}
.mini .sy{position:absolute;left:0;right:0;top:22px;text-align:center;font:700 34px/1 var(--sym);color:rgb(var(--c))}
.mini .ms{position:absolute;left:0;right:0;bottom:7px;text-align:center;font:500 10px var(--num);color:rgba(238,240,247,.85)}
#ck{display:inline-block;font:500 12px/1.4 var(--body);color:rgb(var(--c));letter-spacing:.04em}
#cn{margin:2px 0 2px;font:700 clamp(24px,5.8vmin,32px)/1.15 var(--display)}
#cen{font:500 13px var(--num);color:var(--muted);direction:ltr;unicode-bidi:isolate}
#cx{align-self:start;font:500 16px/1 var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer}
.cbody{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
#atom{width:150px;height:150px;display:block}
#cs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
#cs div{display:grid;gap:1px;min-width:0}
#cs span{font:500 11px var(--body);color:var(--muted)}
#cs b{font:700 14px var(--num);direction:ltr;unicode-bidi:isolate;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cs b.ar{font-family:var(--body);direction:rtl}
#cs .wide{grid-column:1/-1}
#cs .cfg{white-space:normal;font-size:13px}
#cf{margin:0;font:400 15px/1.7 var(--body);color:#dcd9f3;text-wrap:pretty}
@media (max-width:440px){.cbody{grid-template-columns:118px minmax(0,1fr);gap:10px}#atom{width:118px;height:118px}#cs{gap:6px 8px}#cs b{font-size:13px}}

#quiz{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 136px);transform:translateX(-50%);width:min(440px,calc(100% - 32px));box-sizing:border-box;pointer-events:auto;
 text-align:center;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#qq{font:700 clamp(22px,5.6vmin,32px)/1.25 var(--display)}
#qs{margin-top:4px;font:500 12px var(--body);letter-spacing:.06em;color:var(--muted)}
#qf{margin-top:6px;font:500 15px/1.5 var(--body);color:#dcd9f3;min-height:1.5em}
#qf.good{color:var(--ok)} #qf.bad{color:var(--bad)}
#quiz .row{display:flex;justify-content:center;gap:8px;margin-top:8px}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 30vh);transform:translate(-50%,-10px);max-width:calc(100% - 32px);text-align:center;
 font:700 clamp(20px,5.2vmin,34px)/1.35 var(--display);text-wrap:balance;opacity:0;transition:opacity .4s,transform .4s;text-shadow:0 0 22px var(--amber),0 0 48px var(--amber)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 140px);text-align:center;font:400 13px/1.6 var(--body);color:var(--muted);opacity:0;transition:opacity 1.2s;text-wrap:balance}
#hint.on{opacity:.95}

#veil{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));direction:rtl;
 background:radial-gradient(ellipse at 50% 45%,rgba(14,18,40,.55),rgba(5,7,13,.9) 72%);transition:opacity 1s}
#veil.out{opacity:0;pointer-events:none}
#veil .in{display:grid;gap:16px;justify-items:center;text-align:center;max-width:34ch}
#veil .k{font:500 13px var(--body);letter-spacing:.24em;color:var(--muted)}
#veil h1{margin:0;font:700 clamp(38px,9.5vmin,80px)/1.15 var(--display);text-wrap:balance;text-shadow:0 0 30px rgba(143,180,255,.45)}
#veil p{margin:0;font:400 clamp(15px,3.6vmin,19px)/1.75 var(--body);color:#cfd3e8;text-wrap:pretty}
#go{margin-top:6px;font:700 clamp(17px,4vmin,21px) var(--display);color:#1a1000;background:linear-gradient(180deg,#ffe2a8,var(--amber));
 border:0;border-radius:999px;padding:14px 38px;min-width:190px;box-shadow:0 0 34px rgba(255,181,71,.45);cursor:pointer}
#go:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#card,#toast,#veil,.el{transition:none}.states .el.sl::after{animation:none}}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div id="stage" aria-label="الجدول الدوري ثلاثي الأبعاد"><div id="cam"></div></div>
<div class="hud">
 <div id="top">
  <div id="views" role="group" aria-label="شكل العرض">
   <button type="button" data-v="table" aria-pressed="true">الجدول</button>
   <button type="button" data-v="states" aria-pressed="false">الحرارة</button>
   <button type="button" data-v="disc" aria-pressed="false">الاكتشاف</button>
   <button type="button" data-v="sphere" aria-pressed="false">كرة</button>
   <button type="button" data-v="helix" aria-pressed="false">لولب</button>
  </div>
  <div id="findrow"><input id="find" type="search" placeholder="دوّر: حديد، Au، 79…" autocomplete="off" enterkeyhint="search" aria-label="دوّر على عنصر"><button class="pill" id="qbtn" type="button" aria-pressed="false">◎ تحدّي</button></div>
 </div>
 <div id="quiz" hidden><div id="qq"></div><div id="qs"></div><div id="qf"></div><div class="row"><button class="pill" id="qa" type="button" hidden>العب كمان</button><button class="pill" id="qx" type="button">خروج</button></div></div>
 <div id="toast"></div>
 <div id="hint"></div>
 <div id="bottom">
  <div id="temp" hidden>
   <div class="trow"><div><b id="tC">25 °C</b><span id="tK">298 K</span></div><div id="tN"></div></div>
   <input id="tR" type="range" min="0" max="1000" step="1" value="214" aria-label="درجة الحرارة">
   <div class="tpre"><button type="button" data-k="0">الصفر المطلق</button><button type="button" data-k="298.15">حرارة الغرفة</button><button type="button" data-k="1273.15">فرن 1000°</button><button type="button" data-k="5778">سطح الشمس</button></div>
   <div id="tNote"></div>
  </div>
  <div id="legend" role="group" aria-label="العائلات"></div>
 </div>
 <div id="card" aria-live="polite" hidden>
  <div class="chead">
   <div class="mini" id="ctile"><span class="z" id="mz"></span><span class="sy" id="msy"></span><span class="ms" id="mms"></span></div>
   <div><div id="ck"></div><h2 id="cn"></h2><div id="cen"></div></div>
   <button id="cx" type="button" aria-label="سكّر">✕</button>
  </div>
  <div class="cbody"><canvas id="atom" aria-label="نموذج الذرّة"></canvas><div id="cs"></div></div>
  <p id="cf"></p>
 </div>
</div>
<div id="veil"><div class="in">
 <div class="k">مختبر الكيمياء</div>
 <h1>الجدول الدوري للعناصر</h1>
 <p>كل العناصر الـ 118 اللي بيتركّب منها الكون. المس أي عنصر لتشوف ذرّته عم تدور، وسخّن الجدول من الصفر المطلق لحرارة الشمس لتشوف العناصر بتدوب وبتغلي. وبعدها تحدّى حالك.</p>
 <button id="go" type="button">ادخل المختبر</button>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const de=document.documentElement;de.lang='ar';de.dir='rtl';
const touch=matchMedia('(pointer:coarse)').matches;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const angD=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
const R=(a,b)=>a+Math.random()*(b-a);
let sel=-1;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,String(v))}catch(e){}}};
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
const iso=s=>'⁦'+s+'⁩';

/* ---------- the 118 elements ----------
   symbol|Arabic|English|standard atomic weight ([n] = mass number of the longest-lived isotope)|family|melting K|boiling K|year discovered (0 = known since antiquity)
   Melting and boiling points at normal pressure; "~" marks estimates, empty means unknown; C and As sublime, He never freezes at normal pressure. */
const FAM={
 ak:{n:'فلزات قلوية',c:'#ff6b6b'},ae:{n:'فلزات قلوية ترابية',c:'#ff9f43'},tm:{n:'فلزات انتقالية',c:'#f2c94c'},pt:{n:'فلزات ما بعد الانتقالية',c:'#9bd45a'},
 md:{n:'أشباه فلزات',c:'#34d399'},nm:{n:'لافلزات',c:'#38bdf8'},hg:{n:'هالوجينات',c:'#6b8cff'},ng:{n:'غازات نبيلة',c:'#a78bfa'},
 ln:{n:'لانثانيدات',c:'#e879f9'},an:{n:'أكتينيدات',c:'#fb7aa9'}};
Object.values(FAM).forEach(f=>f.rgb=rgb(f.c));
const DATA=`H|هيدروجين|Hydrogen|1.008|nm|13.99|20.27|1766
He|هيليوم|Helium|4.0026|ng|0|4.22|1868
Li|ليثيوم|Lithium|6.94|ak|453.65|1603|1817
Be|بيريليوم|Beryllium|9.0122|ae|1560|2742|1798
B|بورون|Boron|10.81|md|2349|4200|1808

const atomCv=$('atom'),ax=atomCv.getContext('2d');let atomEl=null,nucleus=[];

 ax.setTransform(dpr,0,0,dpr,0,0);ax.clearRect(0,0,w,h);const cx=w/2,cy=h/2,sh=atomEl.shells,ns=sh.length,c=FAM[atomEl.fam].rgb,maxR=w/2-6,t=now;

 sh.forEach((cnt,n)=>{const{rx,ry,rot}=ring(n);ax.save();ax.translate(cx,cy);ax.rotate(rot);ax.strokeStyle=`rgba(${c},.28)`;ax.lineWidth=1;ax.beginPath();ax.ellipse(0,0,rx,ry,0,0,TAU);ax.stroke();ax.restore();
  const om=(reduce?0:1.7)/(n+1);for(let k=0;k<cnt;k++){const a=t*om+TAU*k/cnt,x=Math.cos(a)*rx,y=Math.sin(a)*ry,X=cx+x*Math.cos(rot)-y*Math.sin(rot),Y=cy+x*Math.sin(rot)+y*Math.cos(rot);dots.push({X,Y,front:Math.sin(a)>0})}});
 const dot=d=>{ax.fillStyle=d.front?'#e9f6ff':'rgba(200,220,255,.45)';ax.shadowColor='rgba(143,200,255,.9)';ax.shadowBlur=d.front?8:0;ax.beginPath();ax.arc(d.X,d.Y,d.front?2.6:2,0,TAU);ax.fill();ax.shadowBlur=0};

$('qx').addEventListener('click',()=>{lastUser=now;quizEnd()});$('qa').addEventListener('click',quizStart);

/* ---------- hint, toast ---------- */
let hintT=0,toastT=0;
function hint(text,ms){const h=$('hint');h.textContent=text;h.classList.add('on');clearTimeout(hintT);hintT=setTimeout(()=>h.classList.remove('on'),ms||6000)}
function toast(text){const t=$('toast');t.textContent=text;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- views ---------- */
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{lastUser=now;const v=b.dataset.v;if(v===view)return;if(quiz.on&&v!=='table')quizEnd();
 setView(v);if(v==='states'&&!store.get('pe.statesSeen')){store.set('pe.statesSeen',1);hint('اسحب مؤشر الحرارة: العناصر السائلة بتتموّج، والغازات بتطلع لقدّام وبتطوف.',7000)}}));

/* ---------- input: drag pans the flat views and turns the 3D ones, pinch/wheel zoom, tap picks ---------- */
const ptrs=new Map();let down=null,pinch0=0,s0=1,lastTap=0;
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
stage.addEventListener('pointerdown',e=>{try{stage.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)down={x:e.clientX,y:e.clientY,moved:false};if(ptrs.size===2){pinch0=pd();s0=goal.s;if(down)down.moved=true}});
stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size===1&&down){if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)down.moved=true;if(!down.moved)return;lastUser=now;
  if(!is3D(view)){goal.tx-=dx/cam.s;goal.ty-=dy/cam.s;cam.tx-=dx/cam.s;cam.ty-=dy/cam.s}
  else{goal.yaw+=dx*.005;goal.pitch=clamp(goal.pitch-dy*.004,-1.2,1.2);cam.yaw+=dx*.005;cam.pitch=clamp(cam.pitch-dy*.004,-1.2,1.2)}}
 else if(ptrs.size===2&&pinch0>0){goal.s=clamp(s0*pd()/pinch0,sMin(),sMax());lastUser=now}});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(!ptrs.size&&down&&!down.moved&&started)onTap(e.clientX,e.clientY);
 if(!ptrs.size)down=null;if(ptrs.size<2)pinch0=0};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();lastUser=now;goal.s=clamp(goal.s*Math.exp(-e.deltaY*.0015),sMin(),sMax())},{passive:false});
function onTap(x,y){const hit=document.elementsFromPoint(x,y).find(n=>n.classList&&n.classList.contains('el')&&n.dataset.i!=null);
 if(hit){if(quiz.on)quizAnswer(+hit.dataset.i);else select(+hit.dataset.i);return}
 if(now-lastTap<.32){lastTap=0;if(sel>=0)select(-1);else camHome();return}lastTap=now;if(sel>=0)select(-1)}
addEventListener('keydown',e=>{if(!started||e.target.tagName==='INPUT')return;
 if(e.key==='Escape'){if(quiz.on)quizEnd();else select(-1)}else if(e.key==='/'){e.preventDefault();find.focus()}
 else if(/^[1-5]$/.test(e.key)){const v=['table','states','disc','sphere','helix'][+e.key-1];if(v!==view){if(quiz.on&&v!=='table')quizEnd();setView(v)}}
 else if(sel>=0&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){select((sel+(e.key==='ArrowLeft'?1:-1)+EL.length)%EL.length)}});

/* ---------- background: faint drifting molecules ---------- */
const bg=$('bg'),bx=bg.getContext('2d');const BPR=Math.min(2,devicePixelRatio||1);let nodes=[];
function bgSize(){bg.width=innerWidth*BPR;bg.height=innerHeight*BPR;const n=touch?26:46,cols=Object.values(FAM).map(k=>k.rgb);
 nodes=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:R(-6,6),vy:R(-6,6),r:R(1.2,3),c:cols[Math.floor(Math.random()*cols.length)]}))}
bgSize();addEventListener('resize',bgSize);
function bgStep(dt){const w=innerWidth,h=innerHeight;bx.setTransform(BPR,0,0,BPR,0,0);bx.clearRect(0,0,w,h);
 for(const p of nodes){if(!reduce){p.x+=p.vx*dt;p.y+=p.vy*dt}if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;if(p.y<-20)p.y=h+20;if(p.y>h+20)p.y=-20}
 bx.lineWidth=1;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){bx.strokeStyle=`rgba(${a.c},${(1-d/150)*.16})`;bx.beginPath();bx.moveTo(a.x,a.y);bx.lineTo(b.x,b.y);bx.stroke()}}
 for(const p of nodes){bx.fillStyle=`rgba(${p.c},.5)`;bx.beginPath();bx.arc(p.x,p.y,p.r,0,TAU);bx.fill()}}

/* ---------- start ---------- */
const solidsAtRoom=EL.filter(e=>stateAt(e,298.15)==='s').length;
$('kb').textContent=`على حرارة الغرفة: ${solidsAtRoom} صلب، 2 سائل، 11 غاز`;
function start(){if(started)return;started=true;$('veil').classList.add('out');$('top').classList.add('on');$('bottom').classList.add('on');
 requestAnimationFrame(()=>{measure();setView('table')});
 setTimeout(()=>{if(!$('hint').classList.contains('on'))hint(touch?'قرّب بإصبعين · اسحب · المس أي عنصر لتشوف ذرّته · بالعرض بيبيّن أحسن':'العجلة للتقريب · اسحب · اضغط على أي عنصر · الأرقام 1 لـ 5 بتبدّل الشكل',8000)},2600)}
$('go').addEventListener('click',start);

/* ---------- loop ---------- */
camHome();
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;now=t/1000;
 tilesStep(dt);camStep(dt);bgStep(dt);atomDraw();quizStep();
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
